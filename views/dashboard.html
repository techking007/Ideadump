<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Welcome to your Dashboard, <span id="username"></span>!</h1>
        <button id="logoutButton">Logout</button>

        <h2>Save a New Idea</h2>
        <form id="newIdeaForm">
            <input type="text" id="title" placeholder="Idea Title" required>
            <textarea id="description" placeholder="Idea Description"></textarea>
            <button type="submit">Save Idea</button>
        </form>

        <h2>Your Saved Ideas</h2>
        <ul id="ideaList">
            </ul>
    </div>

    <script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usernameSpan = document.getElementById('username');
            const logoutButton = document.getElementById('logoutButton');
            const newIdeaForm = document.getElementById('newIdeaForm');
            const titleInput = document.getElementById('title');
            const descriptionInput = document.getElementById('description');
            const ideaList = document.getElementById('ideaList');

            // Initialize SimpleMDE for Markdown editing
            const simplemde = new SimpleMDE({ element: descriptionInput });

            // Fetch username on load
            fetch('/api/user') // Assuming you have an endpoint to get user info
                .then(response => response.json())
                .then(data => {
                    if (data.username) {
                        usernameSpan.textContent = data.username;
                    }
                })
                .catch(error => console.error('Error fetching user:', error));

            // Fetch existing ideas on load
            fetchIdeas();

            logoutButton.addEventListener('click', () => {
                fetch('/logout')
                    .then(response => {
                        if (response.ok) {
                            window.location.href = '/';
                        } else {
                            alert('Failed to logout.');
                        }
                    })
                    .catch(error => console.error('Logout error:', error));
            });

            newIdeaForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                const title = titleInput.value.trim();
                const description = simplemde.value(); // Get Markdown content from SimpleMDE

                if (title) {
                    const response = await fetch('/api/ideas', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ title, description }),
                    });

                    if (response.ok) {
                        titleInput.value = '';
                        simplemde.value(''); // Clear SimpleMDE editor
                        fetchIdeas(); // Reload the list
                    } else {
                        const data = await response.json();
                        alert(data.message || 'Failed to save idea.');
                    }
                }
            });

            async function fetchIdeas() {
                const response = await fetch('/api/ideas');
                const data = await response.json();
                ideaList.innerHTML = '';
                data.forEach(idea => {
                    const renderedDescription = marked.parse(idea.description || '');
                    const listItem = document.createElement('li');
                    listItem.innerHTML = `
                        <strong>${idea.title}</strong>
                        <div class="markdown-body">${renderedDescription}</div>
                        <button class="delete-button" data-id="${idea._id}">Delete</button>
                    `;
                    ideaList.appendChild(listItem);
                });

                // Add event listeners to the new delete buttons
                const deleteButtons = document.querySelectorAll('.delete-button');
                deleteButtons.forEach(button => {
                    button.addEventListener('click', async (event) => {
                        const ideaId = event.target.dataset.id;
                        if (confirm('Are you sure you want to delete this idea?')) {
                            const response = await fetch(`/api/ideas/${ideaId}`, {
                                method: 'DELETE',
                            });
                            if (response.ok) {
                                fetchIdeas(); // Reload the list after deletion
                            } else {
                                const data = await response.json();
                                alert(data.message || 'Failed to delete idea.');
                            }
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
