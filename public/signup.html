<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Idea Dump</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Create Your Account</h1>
        <p class="subtitle">Start organizing your ideas today</p>
        
        <button class="google-auth" onclick="window.location.href='/auth/google'">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google Logo">
            Continue with Google
        </button>
        
        <div class="divider">
            <span>or</span>
        </div>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="button">Sign Up</button>
            <div id="signupError" class="error-message" style="display: none;"></div>
        </form>
        
        <p class="auth-link">Already have an account? <a href="/login" class="link">Sign In</a></p>
    </div>
    <script src="/js/auth.js"></script>
</body>
</html>
